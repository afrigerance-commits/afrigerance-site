name: MIRATH Android APK
on:
  push:
    branches: [claude/elegant-wozniak-f2m61x]
    paths: ['android/**', 'capacitor.config.ts', 'package*.json', '.github/workflows/android-apk.yml', 'public/icon-512.png']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx cap sync android
      - name: Compile APK and Android checks
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Package installable test APK
        run: |
          mkdir -p android-delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk android-delivery/MIRATH-Android-test.apk
          sha256sum android-delivery/MIRATH-Android-test.apk > android-delivery/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android-delivery/MIRATH-Android-test.apk > android-delivery/signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MIRATH-Android-APK
          path: android-delivery/
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 installation and content checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            (cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest)
            adb shell am start -n com.baytalilm.app/.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/mirath-android.png
            adb pull /sdcard/mirath-android.png android-delivery/mirath-android.png
      - name: Save checks and emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MIRATH-Android-checks
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android-delivery/mirath-android.png
          retention-days: 30
